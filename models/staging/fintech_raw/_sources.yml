          - name: account_id
            description: Foreign key to account (RAW_ACCOUNTS.account_id)
            data_tests:
              - not_null
          - name: card_id
            description: Foreign key to card (RAW_CARDS.card_id)
            data_tests:
              - not_null
          - name: merchant_id
            description: Foreign key to merchant (RAW_MERCHANTS.merchant_id)
            data_tests:
              - not_null
          - name: transaction_timestamp
            description: Date and time when transaction occurred
            data_tests:
              - not_null
