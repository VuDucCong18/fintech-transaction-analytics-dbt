            description: Transaction amount (always positive in RAW)
            data_tests:
              - not_null
          - name: transaction_currency
            description: Transaction currency code
            data_tests:
              - not_null
          - name: fee_amount
            description: Fee charged for the transaction (always positive or zero)
            data_tests:
              - not_null
