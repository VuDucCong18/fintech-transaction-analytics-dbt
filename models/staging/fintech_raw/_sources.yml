version: 2

sources:
  - name: fintech_raw
    description: Raw fintech customer transaction data from Snowflake
    database: fintech_analytics
    schema: raw
    
    tables:
      - name: raw_customers
        description: >
          Customer master profile table. One row per customer with complete KYC,
          risk, and segment information.
        columns:
          - name: customer_id
            description: Unique customer identifier
            data_tests:
              - unique
              - not_null
          - name: first_name
            description: Customer first name
            data_tests:
              - not_null
          - name: last_name
            description: Customer last name
            data_tests:
              - not_null
          - name: email
            description: Customer email address
            data_tests:
              - unique
              - not_null
          - name: phone_number
            description: Customer phone number
          - name: date_of_birth
            description: Customer date of birth
          - name: gender
            description: Customer gender
          - name: nationality
            description: Customer nationality
          - name: country_of_residence
            description: Customer country of residence
          - name: city
            description: Customer city
          - name: signup_date
            description: Date when customer signed up
            data_tests:
              - not_null
          - name: customer_segment
            description: Customer segment (Retail, Premium, SME)
            data_tests:
              - not_null
          - name: kyc_status
            description: KYC status (Verified, Pending, Rejected)
            data_tests:
              - not_null
          - name: risk_rating
            description: Customer risk rating (Low, Medium, High)
          - name: is_active
            description: Whether customer is active
            data_tests:
              - not_null
          - name: created_at
            description: Record creation timestamp

      - name: raw_accounts
        description: >
          Customer financial account table. One customer can own multiple accounts
          (Savings, Checking, Credit). Includes balance and credit limit.
        columns:
          - name: account_id
            description: Unique account identifier
            data_tests:
              - unique
              - not_null
          - name: customer_id
            description: Foreign key to customer
            data_tests:
              - not_null
          - name: account_type
            description: Type of account (Savings, Checking, Credit)
            data_tests:
              - not_null
          - name: account_currency
            description: Account currency code (SGD, USD, MYR, etc.)
            data_tests:
              - not_null
          - name: account_status
            description: Status of account (Active, Dormant, Closed, Suspended)
            data_tests:
              - not_null
          - name: opened_date
            description: Date when account was opened
            data_tests:
              - not_null
          - name: closed_date
            description: Date when account was closed (null if still open)
          - name: available_balance
            description: Current available account balance
            data_tests:
              - not_null
          - name: credit_limit
            description: Credit limit (for credit accounts)
          - name: is_joint_account
            description: Whether account is joint
            data_tests:
              - not_null
          - name: created_at
            description: Record creation timestamp

      - name: raw_cards
        description: >
          Payment card table. One account can have multiple cards (physical or virtual).
          Includes card validity, limits, and status.
        columns:
          - name: card_id
            description: Unique card identifier
            data_tests:
              - unique
              - not_null
          - name: account_id
            description: Foreign key to associated account
            data_tests:
              - not_null
          - name: card_type
            description: Type of card (Debit, Credit, Prepaid)
            data_tests:
              - not_null
          - name: card_network
            description: Card network (Visa, Mastercard, Amex)
            data_tests:
              - not_null
          - name: card_status
            description: Status of card (Active, Blocked, Expired, Cancelled)
            data_tests:
              - not_null
          - name: issued_date
            description: Card issuance date
            data_tests:
              - not_null
          - name: expiry_date
            description: Card expiry date
            data_tests:
              - not_null
          - name: is_virtual
            description: Whether card is virtual
            data_tests:
              - not_null
          - name: daily_limit
            description: Daily spending limit on card
          - name: created_at
            description: Record creation timestamp

      - name: raw_merchants
        description: >
          Merchant master data. One row per merchant with business details,
          category, location, and onboarding status.
        columns:
          - name: merchant_id
            description: Unique merchant identifier
            data_tests:
              - unique
              - not_null
          - name: merchant_name
            description: Name of the merchant
            data_tests:
              - not_null
          - name: merchant_category
            description: >
              Business category (Grocery, Travel, Crypto Exchange, SaaS,
              E-commerce, ATM, etc.)
            data_tests:
              - not_null
          - name: merchant_country
            description: Merchant country
            data_tests:
              - not_null
          - name: merchant_city
            description: Merchant city
            data_tests:
              - not_null
          - name: onboarding_date
            description: Date merchant was onboarded
            data_tests:
              - not_null
          - name: merchant_status
            description: Status of merchant (Active, Suspended, Closed)
            data_tests:
              - not_null
          - name: created_at
            description: Record creation timestamp

      - name: raw_fx_rates
        description: >
          Daily FX conversion table. Primarily converts all currencies into SGD.
          Join on transaction_date = rate_date, transaction_currency = from_currency.
        columns:
          - name: fx_rate_id
            description: Unique foreign exchange rate record identifier
            data_tests:
              - unique
              - not_null
          - name: rate_date
            description: Date of the exchange rate
            data_tests:
              - not_null
          - name: from_currency
            description: Source currency code (USD, MYR, INR, VND, etc.)
            data_tests:
              - not_null
          - name: to_currency
            description: Target currency code (always SGD)
            data_tests:
              - not_null
          - name: exchange_rate
            description: Exchange rate value for conversion
            data_tests:
              - not_null
          - name: created_at
            description: Record creation timestamp

      - name: raw_transactions
        description: >
          Main transaction event table. One row per transaction with all details
          including amount, currency, type, status, and failure reason.
          Raw amounts are always positive; sign logic applied downstream in MARTS.
        columns:
          - name: transaction_id
            description: Unique transaction identifier
            data_tests:
              - unique
              - not_null
          - name: customer_id
            description: Foreign key to customer
            data_tests:
              - not_null
          - name: account_id
            description: Foreign key to account
            data_tests:
              - not_null
          - name: card_id
            description: Foreign key to card
            data_tests:
              - not_null
          - name: merchant_id
            description: Foreign key to merchant
            data_tests:
              - not_null
          - name: transaction_timestamp
            description: Date and time when transaction occurred
            data_tests:
              - not_null
          - name: transaction_type
            description: >
              Type of transaction (Purchase, Withdrawal, Deposit, Transfer, Refund).
            data_tests:
              - not_null
          - name: transaction_status
            description: Status of transaction (Success, Failed, Pending)
            data_tests:
              - not_null
          - name: transaction_amount
            description: >
              Transaction amount (always positive in RAW).
              Sign logic applied downstream in MARTS.
            data_tests:
              - not_null
          - name: transaction_currency
            description: Transaction currency code
            data_tests:
              - not_null
          - name: fee_amount
            description: Fee charged for the transaction (always positive or zero)
            data_tests:
              - not_null
          - name: channel
            description: Channel through which transaction was made
            data_tests:
              - not_null
          - name: is_cross_border
            description: Whether transaction is cross-border
            data_tests:
              - not_null
          - name: failure_reason
            description: Reason for transaction failure (null if successful)
          - name: created_at
            description: Record creation timestamp
