version: 2

models:
  stg_customers:
    description: Cleaned customer dimension from RAW_CUSTOMERS
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: email
        data_tests:
          - unique
          - not_null
      - name: first_name
        data_tests:
          - not_null
      - name: last_name
        data_tests:
          - not_null
      - name: signup_date
        data_tests:
          - not_null
