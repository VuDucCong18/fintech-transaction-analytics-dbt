version: 2

models:
  # ==================== CORE DIMENSIONS ====================

  - name: dim_customers
    description: >
      Analytics-ready customer dimension serving as the customer master.
      One row per customer with complete profile, KYC status, risk rating,
      segment, and age information. Used for customer analytics, segmentation,
      and behavior analysis.
    columns:
      - name: customer_id
        description: Unique customer identifier (primary key)
        tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name (trimmed)
        tests:
          - not_null
      - name: last_name
        description: Customer last name (trimmed)
        tests:
          - not_null
      - name: full_name
        description: Full name combining first_name and last_name (derived field)
        tests:
          - not_null
      - name: email
        description: Customer email address (lowercase, trimmed, unique)
        tests:
          - unique
          - not_null
      - name: phone_number
        description: Customer phone number
      - name: date_of_birth
        description: Customer date of birth
      - name: gender
        description: Customer gender
      - name: nationality
        description: Customer nationality
      - name: country_of_residence
        description: Customer country of residence
      - name: city
        description: Customer city of residence
      - name: signup_date
        description: Date when customer account was created
        tests:
          - not_null
      - name: signup_month
        description: Month of signup truncated to first day (for cohort analysis)
        tests:
          - not_null
      - name: customer_age
        description: Calculated age of customer account in years (derived from date_of_birth)
      - name: kyc_status
        description: Know Your Customer verification status
        tests:
          - not_null
          - accepted_values:
              values: ['VERIFIED', 'PENDING', 'REJECTED']
      - name: risk_rating
        description: Customer risk rating used for compliance and monitoring
        tests:
          - accepted_values:
              values: ['LOW', 'MEDIUM', 'HIGH']
      - name: customer_segment
        description: Business segment classification for marketing and product strategy
        tests:
          - not_null
          - accepted_values:
              values: ['RETAIL', 'PREMIUM', 'SME']
      - name: is_active
        description: Boolean flag indicating whether customer is currently active

  - name: dim_accounts
    description: >
      Analytics-ready account dimension with account details, currency, balance,
      type, and status. One row per account. Used for account portfolio analytics,
      balance tracking, and account lifecycle analysis.
    columns:
      - name: account_id
        description: Unique account identifier (primary key)
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to customer
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: account_type
        description: Type of account (SAVINGS, CHECKING, CREDIT)
        tests:
          - not_null
          - accepted_values:
              values: ['SAVINGS', 'CHECKING', 'CREDIT']
      - name: account_currency
        description: Account currency code (SGD, USD, MYR, INR, VND, etc.)
        tests:
          - not_null
      - name: available_balance
        description: Current available account balance
        tests:
          - not_null
      - name: credit_limit
        description: Credit limit for credit accounts (null for other types)
      - name: account_status
        description: Current account status (ACTIVE, DORMANT, CLOSED, SUSPENDED)
        tests:
          - not_null
          - accepted_values:
              values: ['ACTIVE', 'DORMANT', 'CLOSED', 'SUSPENDED']
      - name: account_is_active
        description: Boolean flag for active accounts (derived from account_status)
        tests:
          - not_null
      - name: opened_date
        description: Date when account was opened
        tests:
          - not_null
      - name: closed_date
        description: Date when account was closed (null if still open)
      - name: is_joint_account
        description: Whether the account is a joint account

  - name: dim_cards
    description: >
      Analytics-ready card dimension with card type, network, limits, and status.
      One row per card. Used for card portfolio analytics, card lifecycle analysis,
      and cardholder expense tracking.
    columns:
      - name: card_id
        description: Unique card identifier (primary key)
        tests:
          - unique
          - not_null
      - name: account_id
        description: Foreign key to associated account
        tests:
          - not_null
          - relationships:
              to: ref('dim_accounts')
              field: account_id
      - name: card_type
        description: Type of card (DEBIT, CREDIT, PREPAID)
        tests:
          - not_null
          - accepted_values:
              values: ['DEBIT', 'CREDIT', 'PREPAID']
      - name: card_network
        description: Card network provider (VISA, MASTERCARD, AMEX, etc.)
        tests:
          - not_null
          - accepted_values:
              values: ['VISA', 'MASTERCARD', 'AMEX', 'JCB']
      - name: daily_limit
        description: Daily spending limit on the card
      - name: card_status
        description: Status of card (ACTIVE, BLOCKED, EXPIRED, CANCELLED)
        tests:
          - not_null
          - accepted_values:
              values: ['ACTIVE', 'BLOCKED', 'EXPIRED', 'CANCELLED']
      - name: issued_date
        description: Card issuance date
        tests:
          - not_null
      - name: expiry_date
        description: Card expiry date
        tests:
          - not_null
      - name: is_virtual
        description: Whether card is virtual (as opposed to physical card)
        tests:
          - not_null
      - name: card_is_active
        description: >
          Boolean flag for active non-expired cards
          (derived: ACTIVE status and expiry_date > today)
        tests:
          - not_null

  - name: dim_merchants
    description: >
      Analytics-ready merchant dimension with business details, category,
      location, and status. One row per merchant. Used for merchant performance
      analytics, spend by category analysis, and merchant portfolio management.
    columns:
      - name: merchant_id
        description: Unique merchant identifier (primary key)
        tests:
          - unique
          - not_null
      - name: merchant_name
        description: Merchant business name (trimmed)
        tests:
          - not_null
      - name: merchant_category
        description: >
          Business category (GROCERY, TRAVEL, CRYPTO_EXCHANGE, SAAS, E-COMMERCE,
          ATM, RESTAURANT, ENTERTAINMENT, etc.)
        tests:
          - not_null
      - name: merchant_country
        description: Merchant country (standardized uppercase)
        tests:
          - not_null
      - name: merchant_city
        description: Merchant city (standardized uppercase)
        tests:
          - not_null
      - name: onboarding_date
        description: Date merchant was onboarded to platform
        tests:
          - not_null
      - name: merchant_status
        description: Current merchant status (ACTIVE, SUSPENDED, CLOSED)
        tests:
          - not_null
          - accepted_values:
              values: ['ACTIVE', 'SUSPENDED', 'CLOSED']
      - name: merchant_is_active
        description: Boolean flag for active merchants (derived from merchant_status)
        tests:
          - not_null

  # ==================== FACT TABLES ====================

  - name: fact_transactions
    description: >
      Core transaction fact table with complete transaction details and all
      dimension foreign keys. One row per transaction. Central table for transaction
      analytics, revenue reporting, customer behavior analysis, and transaction
      monitoring. Includes signed amounts, SGD equivalents, status flags, and
      cross-border indicators.
    columns:
      - name: transaction_id
        description: Unique transaction identifier (primary key)
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to customer
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: account_id
        description: Foreign key to account
        tests:
          - not_null
          - relationships:
              to: ref('dim_accounts')
              field: account_id
      - name: card_id
        description: Foreign key to card
        tests:
          - not_null
          - relationships:
              to: ref('dim_cards')
              field: card_id
      - name: merchant_id
        description: Foreign key to merchant
        tests:
          - not_null
          - relationships:
              to: ref('dim_merchants')
              field: merchant_id
      - name: transaction_date
        description: Date of transaction
        tests:
          - not_null
      - name: transaction_month
        description: Month of transaction (truncated to first day for aggregation)
        tests:
          - not_null
      - name: transaction_type
        description: >
          Type of transaction (Purchase, Withdrawal, Deposit, Transfer, Refund).
          Used to determine sign of signed_transaction_amount.
        tests:
          - not_null
          - accepted_values:
              values: ['Purchase', 'Withdrawal', 'Deposit', 'Transfer', 'Refund']
      - name: transaction_status
        description: Status of transaction (Success, Failed, Pending)
        tests:
          - not_null
          - accepted_values:
              values: ['Success', 'Failed', 'Pending']
      - name: channel
        description: Transaction channel or initiation method (POS, Web, Mobile App, ATM)
        tests:
          - not_null
          - accepted_values:
              values: ['POS', 'Web', 'Mobile App', 'ATM']
      - name: failure_reason
        description: >
          Reason for transaction failure. Null if transaction is successful
          or pending.
      - name: transaction_amount
        description: >
          Transaction amount in original currency.
          Always positive. Use signed_transaction_amount for cash flow analysis.
        tests:
          - not_null
      - name: transaction_currency
        description: Currency code of transaction (SGD, USD, MYR, INR, VND, etc.)
        tests:
          - not_null
      - name: fee_amount
        description: Transaction processing fee (always positive or zero)
        tests:
          - not_null
      - name: account_currency
        description: Account currency (from joined dim_accounts)
        tests:
          - not_null
      - name: signed_transaction_amount
        description: >
          Signed transaction amount for cash flow analysis.
          Outflows (Purchase, Withdrawal, Transfer) are NEGATIVE.
          Inflows (Deposit, Refund) are POSITIVE.
          Used for P&L and cash flow reporting.
        tests:
          - not_null
      - name: transaction_amount_sgd
        description: >
          Transaction amount converted to SGD for consolidated reporting.
          Direct SGD transactions use transaction_amount as-is.
          Other currencies converted using FX rates from stg_fx_rates
          joined on transaction_date and currency pair.
        tests:
          - not_null
      - name: fee_amount_sgd
        description: Transaction fee amount converted to SGD using FX rates
        tests:
          - not_null
      - name: is_successful
        description: Boolean flag indicating successful transaction completion
      - name: is_failed
        description: Boolean flag indicating failed transaction
      - name: is_pending
        description: Boolean flag indicating pending transaction
      - name: is_cross_border
        description: >
          Boolean flag for cross-border transactions
          (transaction_currency differs from account_currency)

  # ==================== AGGREGATES ====================

  - name: fct_daily_transaction_summary
    description: >
      Daily aggregated transaction metrics by currency, channel, and status.
      One row per (transaction_date, transaction_currency, channel, status) grain.
      Used for monitoring daily transaction volume, value, and performance trends.
      Supports dashboards and reports for transaction analysis, revenue tracking,
      and channel performance monitoring.
    columns:
      - name: transaction_date
        description: Date of transactions in this aggregate row
        tests:
          - not_null
      - name: transaction_currency
        description: Currency of transactions in this aggregate
        tests:
          - not_null
      - name: channel
        description: Transaction channel for this aggregate
        tests:
          - not_null
          - accepted_values:
              values: ['POS', 'Web', 'Mobile App', 'ATM']
      - name: transaction_status
        description: Transaction status grouping for this aggregate
        tests:
          - not_null
          - accepted_values:
              values: ['Success', 'Failed', 'Pending']
      - name: transaction_count
        description: Total number of transactions for this day/currency/channel/status combination
      - name: successful_transaction_count
        description: Count of successful transactions
      - name: failed_transaction_count
        description: Count of failed transactions
      - name: pending_transaction_count
        description: Count of pending transactions
      - name: total_transaction_amount
        description: Total transaction amount in original currency for this grouping
      - name: total_transaction_amount_sgd
        description: Total transaction amount in SGD for this grouping
      - name: total_fee_amount
        description: Total fees in original currency for this grouping
      - name: total_fee_amount_sgd
        description: Total fees in SGD for this grouping
      - name: success_rate
        description: Percentage of successful transactions (successful_count / total_count * 100)
      - name: failed_rate
        description: Percentage of failed transactions (failed_count / total_count * 100)
      - name: cross_border_transaction_count
        description: Count of cross-border transactions in this grouping

  - name: fct_customer_transaction_summary
    description: >
      Customer-level aggregated transaction metrics for lifetime analysis.
      One row per customer with lifetime transaction statistics including volume,
      spend, success rates, and behavior indicators. Used for customer segmentation,
      cohort analysis, customer value assessment, and churn prediction. Supports
      customer analytics dashboards and targeted marketing campaigns.
    columns:
      - name: customer_id
        description: Unique customer identifier (primary key for this aggregate)
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: total_transactions
        description: Total number of transactions by this customer across all time
      - name: successful_transactions
        description: Count of successful transactions by customer
      - name: failed_transactions
        description: Count of failed transactions by customer
      - name: pending_transactions
        description: Count of pending transactions by customer
      - name: total_spend_sgd
        description: Total lifetime spending by customer in SGD (absolute value of transaction amounts)
      - name: total_fee_generated_sgd
        description: Total fees generated from customer transactions in SGD
      - name: first_transaction_date
        description: Date of customer's first transaction (oldest transaction)
      - name: last_transaction_date
        description: Date of customer's most recent transaction (newest transaction)
      - name: active_transaction_days
        description: Number of distinct calendar days customer conducted transactions
      - name: cross_border_transactions
        description: Total count of cross-border transactions by customer
      - name: preferred_channel
        description: Most frequently used transaction channel by customer
        tests:
          - accepted_values:
              values: ['POS', 'Web', 'Mobile App', 'ATM']
      - name: most_used_transaction_type
        description: Most frequently used transaction type by customer
        tests:
          - accepted_values:
              values: ['Purchase', 'Withdrawal', 'Deposit', 'Transfer', 'Refund']